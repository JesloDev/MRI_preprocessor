# Feature -> Algorithm -> Implementation -> License -> Bundling matrix.
# This is the single source of truth for what's safe to bundle offline
# and what remains an optional / user-supplied engine. Update this file
# whenever a new step is added to app/pipeline/steps_*.py.
#
# PR4: each capability now carries a `maturity` field that mirrors the
# `maturity` attribute on ProcessingStep. The schema field is the source
# of truth; this YAML is the human-readable mirror. The 5 levels are:
#
#   planned          - declared but not implemented (UI shows "coming soon")
#   experimental     - placeholder / not validated (UI shows "Experimental" badge)
#   reference        - correct but slower/less-validated than the standard
#                      (UI shows "Reference" badge with swap-in suggestion)
#   production_ready - validated against reference outputs (UI shows no badge)
#   external_engine  - shelled out to FSL/FreeSurfer/ANTs (UI shows "External")
#
# NOTE: you said this project is non-commercial for now, so FSL and
# FreeSurfer are listed as "bundle: optional" rather than "bundle: no".
# If commercial use ever becomes a possibility, re-review the FSL and
# FreeSurfer license terms before shipping them in any paid or
# service-based product.

capabilities:
  - name: reorientation
    engine: nibabel
    license: MIT
    bundle: yes
    maturity: production_ready

  - name: bias_field_correction
    engine: SimpleITK (N4ITK)
    license: Apache-2.0
    bundle: yes
    maturity: production_ready

  - name: brain_extraction
    engine: placeholder (Otsu + largest CC)
    license: Apache-2.0 (SimpleITK)
    bundle: yes
    maturity: experimental
    validation_notes: >
      Current implementation uses Otsu thresholding + largest connected
      component. This is a placeholder and should not be considered
      equivalent to validated neuroimaging brain extraction tools like
      SynthStrip or HD-BET. Replace before use in published research.
    note: >
      Replace with SynthStrip or HD-BET for production quality.
      Verify SynthStrip's model-weight license separately from
      FreeSurfer's code license before bundling.

  - name: registration
    engine: SimpleITK
    license: Apache-2.0
    bundle: yes
    maturity: reference
    validation_notes: >
      Reference SimpleITK registration with Mattes Mutual Information
      metric and multi-resolution pyramid. Suitable for development and
      research use; for clinical-grade registration consider ANTs (SyN)
      or FSL FLIRT/FNIRT.

  - name: resampling
    engine: SimpleITK
    license: Apache-2.0
    bundle: yes
    maturity: production_ready

  - name: intensity_normalization
    engine: nibabel/numpy
    license: MIT / BSD
    bundle: yes
    maturity: production_ready

  - name: dwi_denoise
    engine: DIPY (Local PCA)
    license: BSD-3-Clause
    bundle: yes
    maturity: production_ready

  - name: gibbs_ringing_correction
    engine: DIPY
    license: BSD-3-Clause
    bundle: yes
    maturity: production_ready

  - name: dwi_motion_eddy_correction
    engine: DIPY (affine reg to b0)
    license: BSD-3-Clause
    bundle: yes
    maturity: reference
    validation_notes: >
      Reference DIPY affine registration to b0. Suitable for research
      use, but FSL eddy is the validated standard for production
      diffusion preprocessing.
    alternative: FSL eddy/topup (more validated, non-commercial license)

  - name: tensor_fitting
    engine: DIPY
    license: BSD-3-Clause
    bundle: yes
    maturity: production_ready

  - name: remove_initial_volumes
    engine: nibabel
    license: MIT
    bundle: yes
    maturity: production_ready

  - name: fmri_motion_correction
    engine: SimpleITK (reference rigid registration)
    license: Apache-2.0
    bundle: yes
    maturity: reference
    validation_notes: >
      Reference SimpleITK rigid registration of every volume to a
      reference. Functionally correct but slower than FSL MCFLIRT.
    alternative: FSL MCFLIRT (faster, non-commercial license)

  - name: temporal_filtering
    engine: nilearn
    license: BSD-3-Clause
    bundle: yes
    maturity: production_ready

  - name: confound_regression
    engine: nilearn
    license: BSD-3-Clause
    bundle: yes
    maturity: production_ready

  - name: spatial_smoothing
    engine: nilearn
    license: BSD-3-Clause
    bundle: yes
    maturity: production_ready

  # Not yet implemented -- listed here so the matrix stays the planning
  # document even ahead of code.
  - name: cortical_reconstruction
    engine: FreeSurfer (recon-all)
    license: FreeSurfer custom license, requires license file
    bundle: optional (license-file gated, non-commercial use only)
    maturity: planned
    status: not_implemented

  - name: tractography
    engine: DIPY or MRtrix3
    license: BSD-3-Clause (DIPY) / MPL-2.0 (MRtrix3)
    bundle: yes (DIPY) / yes (MRtrix3)
    maturity: planned
    status: not_implemented
